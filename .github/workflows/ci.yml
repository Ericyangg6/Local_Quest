name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # `next build` generates next-env.d.ts (asset types) that typecheck needs, and proves the
      # production build works. Placeholder values only: nothing is deployed from CI.
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-placeholder-not-a-secret
      - run: npm run typecheck
      # The quest planner runs in mock mode: CI never touches Snowflake or production data.
      - run: npm test
        env:
          TEST_DATABASE_URL: mongodb://localhost:27017/localquest_ci

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t local-quest-web ./web
