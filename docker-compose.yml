# Production-like stack on one machine: MongoDB + the web app (which also plans quests).
#
#   1. Fill in web/.env.local (from web/.env.example) with QUEST_PLANNER=snowflake and the
#      app's SNOWFLAKE_* login, and set SNOWFLAKE_PRIVATE_KEY_PATH to the .p8 file on this machine.
#   2. SNOWFLAKE_PRIVATE_KEY_PATH=/path/to/key.p8 docker compose up -d --build
#      then open http://localhost:${WEB_PORT:-3000}
#
# See docs/Deployment.md for hosted deployment, smoke checks, and rollback.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    restart: unless-stopped
    env_file: web/.env.local
    environment:
      DATABASE_URL: mongodb://mongo:27017/localquest
      # The key file is mounted below; the host path doesn't exist inside the container.
      SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/snowflake_key.p8
      # Auth.js must trust the Host header when it isn't running on Vercel.
      AUTH_TRUST_HOST: "true"
    secrets:
      - source: snowflake_key
        target: snowflake_key.p8
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

secrets:
  snowflake_key:
    file: ${SNOWFLAKE_PRIVATE_KEY_PATH:?Set SNOWFLAKE_PRIVATE_KEY_PATH to the app's .p8 key file}

volumes:
  mongo-data:
